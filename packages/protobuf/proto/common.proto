syntax = "proto3";

package sakti.common.v1;

message Empty {}

message DeleteResponse {
  bool success = 1;
}

message ApiUser {
  string id = 1;
  string email = 2;
  string name = 3;
}

message Merchant {
  string id = 1;
  string name = 2;
  string created_at = 3;
  string updated_at = 4;
}

message Outlet {
  string id = 1;
  string merchant_id = 2;
  string name = 3;
  string address = 4;
  string timezone = 5;
  bool has_address = 6;
  bool is_active = 7;
  string created_at = 8;
  string updated_at = 9;
}

message Register {
  string id = 1;
  string outlet_id = 2;
  string name = 3;
  string short_id = 4;
  string pairing_code = 5;
  bool has_pairing_code = 6;
  string pairing_expires_at = 7;
  bool has_pairing_expires_at = 8;
  bool is_active = 9;
  string created_at = 10;
  string updated_at = 11;
}

message Staff {
  string id = 1;
  string merchant_id = 2;
  string outlet_id = 3;
  bool has_outlet_id = 4;
  string name = 5;
  string role = 6;
  bool is_active = 7;
  bool has_pin = 8;
  string created_at = 9;
  string updated_at = 10;
}
